name: macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
      - name: Release configuration tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Tests/ReleaseTests
      - name: Tests
        run: swift test --no-parallel
      - name: Subprocess progress with one cooperative worker
        timeout-minutes: 2
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: swift test --skip-build --no-parallel --filter 'RepairRegressionTests/(foregroundLane|concurrentPipeDraining)|ResolverTimingTests|ResolverOutputBoundsTests|QueuedPreparedNextPriorityTests|YTDlpQueuedPriorityTests'
      - name: Pull disk failure recovery
        timeout-minutes: 2
        env:
          MUSES_PULL_DISK_FAILURE_TEST: "1"
        run: swift test --skip-build --no-parallel --filter PlaylistPullPersistenceTests/diskFailureThenRetry
      - name: Generate App Intents metadata
        run: |
          xcodebuild \
            -scheme Muses \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .build/out \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Prepare pinned audio dependency
        timeout-minutes: 20
        run: python3 Scripts/prepare-mpv.py --work-dir "$RUNNER_TEMP/muses-mpv" --jobs 3
      - name: Package preview
        env:
          MUSES_VERSION: 0.6.2
          MUSES_MPV_DEPENDENCY_DIR: ${{ runner.temp }}/muses-mpv
        run: |
          ./Scripts/build-app.sh --identity -
          ./Scripts/sign-update.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Muses-preview
          path: build/Muses-*.zip
